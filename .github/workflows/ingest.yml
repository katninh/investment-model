name: Data Pipeline

on:
  schedule:
    - cron: '0 22 * * 1-5' # daily — weekdays after US close (mode=daily)
    - cron: '0 4 * * 6' # weekly — Saturday (mode=weekly)
    - cron: '0 6 1-7 * 6' # monthly — first Saturday (mode=monthly)
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        type: choice
        options: [daily, weekly, monthly, full]
        default: daily

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 4 * * 6")     MODE="weekly" ;;
              "0 6 1-7 * 6")   MODE="monthly" ;;
              *)               MODE="daily" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Collect
        run: python pipeline/collect.py --mode ${{ steps.mode.outputs.mode }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
